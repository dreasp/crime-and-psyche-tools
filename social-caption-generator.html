<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crime and Psyche — Social Media Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d0f;
    color: #e8e4dc;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #b8860b;
    margin-bottom: 12px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 900;
    color: #f0ebe0;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  header p {
    font-size: 14px;
    color: #7a7570;
    font-weight: 300;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: #b8860b;
    margin: 16px auto;
  }

  .card {
    background: #161618;
    border: 1px solid #2a2820;
    border-radius: 4px;
    padding: 28px;
    margin-bottom: 20px;
  }

  .card-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #b8860b;
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8580;
    margin-bottom: 8px;
  }

  input[type="text"], textarea {
    width: 100%;
    background: #0d0d0f;
    border: 1px solid #2a2820;
    border-radius: 3px;
    color: #e8e4dc;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    margin-bottom: 20px;
    transition: border-color 0.2s;
    resize: vertical;
  }

  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: #b8860b;
  }

  input[type="text"]::placeholder, textarea::placeholder {
    color: #3a3830;
  }

  textarea { min-height: 120px; }

  .tone-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .tone-btn {
    background: #0d0d0f;
    border: 1px solid #2a2820;
    border-radius: 3px;
    color: #7a7570;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .tone-btn:hover { border-color: #b8860b; color: #e8e4dc; }
  .tone-btn.active { background: #b8860b22; border-color: #b8860b; color: #b8860b; }

  .generate-btn {
    width: 100%;
    background: #b8860b;
    border: none;
    border-radius: 3px;
    color: #0d0d0f;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 16px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .generate-btn:hover { background: #d4a012; }
  .generate-btn:disabled { background: #3a3020; color: #5a5048; cursor: not-allowed; }

  .results { margin-top: 32px; }

  .platform-card {
    background: #161618;
    border: 1px solid #2a2820;
    border-radius: 4px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .platform-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid #2a2820;
  }

  .platform-name {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .platform-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .dot-canva { background: #7B2FBE; }
  .dot-instagram { background: #E1306C; }
  .dot-facebook { background: #1877F2; }

  .copy-btn {
    background: transparent;
    border: 1px solid #2a2820;
    border-radius: 3px;
    color: #7a7570;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .copy-btn:hover { border-color: #b8860b; color: #b8860b; }
  .copy-btn.copied { border-color: #4a8a4a; color: #4a8a4a; }

  .platform-content {
    padding: 20px;
    font-size: 14px;
    line-height: 1.7;
    color: #c8c4bc;
    white-space: pre-wrap;
    min-height: 80px;
  }

  .loading {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px;
    color: #7a7570;
    font-size: 13px;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid #2a2820;
    border-top-color: #b8860b;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    padding: 16px 20px;
    color: #c0504a;
    font-size: 13px;
  }

  .api-key-note {
    font-size: 12px;
    color: #4a4840;
    margin-top: -12px;
    margin-bottom: 20px;
  }

  .char-hint {
    font-size: 11px;
    color: #4a4840;
    margin-top: -16px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">Crime and Psyche</div>
    <h1>Social Media Generator</h1>
    <div class="divider"></div>
    <p>Generate captions for Instagram, Facebook, and a Canva headline in one click</p>
  </header>

  <div class="card">
    <div class="card-title">API Settings</div>
    <label>Anthropic API Key</label>
    <input type="text" id="apiKey" placeholder="sk-ant-..." />
    <p class="api-key-note">Saved locally in your browser — never sent anywhere except Anthropic.</p>
  </div>

  <div class="card">
    <div class="card-title">Case Details</div>

    <label>Case Name</label>
    <input type="text" id="caseName" placeholder="e.g. The Murder of Brianna Ghey" />

    <label>Short Summary</label>
    <textarea id="summary" placeholder="Paste a brief summary, your blog post intro, or key facts about the case. 2–3 sentences is enough."></textarea>

    <label>Tone</label>
    <div class="tone-row" id="toneRow">
      <button class="tone-btn active" data-tone="Empathetic">Empathetic</button>
      <button class="tone-btn" data-tone="Investigative">Investigative</button>
      <button class="tone-btn" data-tone="Dramatic">Dramatic</button>
      <button class="tone-btn" data-tone="Analytical">Analytical</button>
    </div>

    <label>Post Type (optional)</label>
    <input type="text" id="postType" placeholder="e.g. New video out now / Case update / Deep dive" />

    <button class="generate-btn" id="generateBtn" onclick="generate()">Generate Social Posts</button>
  </div>

  <div class="results" id="results" style="display:none;">

    <div class="platform-card" id="card-canva">
      <div class="platform-header">
        <div class="platform-name">
          <span class="platform-dot dot-canva"></span>
          Canva Headline
        </div>
        <button class="copy-btn" onclick="copyText('canva-content', this)">Copy</button>
      </div>
      <div class="platform-content" id="canva-content"></div>
    </div>

    <div class="platform-card" id="card-instagram">
      <div class="platform-header">
        <div class="platform-name">
          <span class="platform-dot dot-instagram"></span>
          Instagram Caption
        </div>
        <button class="copy-btn" onclick="copyText('instagram-content', this)">Copy</button>
      </div>
      <div class="platform-content" id="instagram-content"></div>
    </div>

    <div class="platform-card" id="card-facebook">
      <div class="platform-header">
        <div class="platform-name">
          <span class="platform-dot dot-facebook"></span>
          Facebook Caption
        </div>
        <button class="copy-btn" onclick="copyText('facebook-content', this)">Copy</button>
      </div>
      <div class="platform-content" id="facebook-content"></div>
    </div>

  </div>

</div>

<script>
  const API_KEY_STORAGE = 'cap_anthropic_key';

  // Load saved API key
  const savedKey = localStorage.getItem(API_KEY_STORAGE);
  if (savedKey) document.getElementById('apiKey').value = savedKey;

  // Save API key on change
  document.getElementById('apiKey').addEventListener('change', () => {
    localStorage.setItem(API_KEY_STORAGE, document.getElementById('apiKey').value.trim());
  });

  // Tone selector
  let selectedTone = 'Empathetic';
  document.getElementById('toneRow').addEventListener('click', e => {
    if (e.target.classList.contains('tone-btn')) {
      document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      selectedTone = e.target.dataset.tone;
    }
  });

  function setLoading(platformId) {
    document.getElementById(platformId + '-content').innerHTML = `<div class="loading"><div class="spinner"></div>Generating...</div>`;
  }

  function setContent(platformId, text) {
    document.getElementById(platformId + '-content').textContent = text;
  }

  function setError(platformId, msg) {
    document.getElementById(platformId + '-content').innerHTML = `<div class="error">${msg}</div>`;
  }

  async function generate() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const caseName = document.getElementById('caseName').value.trim();
    const summary = document.getElementById('summary').value.trim();
    const postType = document.getElementById('postType').value.trim();

    if (!apiKey) { alert('Please enter your Anthropic API key.'); return; }
    if (!caseName) { alert('Please enter a case name.'); return; }
    if (!summary) { alert('Please enter a short summary.'); return; }

    localStorage.setItem(API_KEY_STORAGE, apiKey);

    const btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.textContent = 'Generating...';

    document.getElementById('results').style.display = 'block';
    setLoading('canva');
    setLoading('instagram');
    setLoading('facebook');

    const postTypeNote = postType ? `Post context: ${postType}.` : '';

    const prompt = `You are writing social media content for "Crime and Psyche with Drea" — a true crime YouTube channel and blog that explores criminal cases through a psychological lens. The brand voice is empathetic, serious, and victim-centered. No sensationalism. No em dashes.

Case name: ${caseName}
Summary: ${summary}
Tone: ${selectedTone}
${postTypeNote}

Blog: https://crimeandpsyche.com
YouTube: https://www.youtube.com/@crimeandpsyche

Generate exactly three items. Use these exact labels:

CANVA_HEADLINE:
A short, punchy headline (maximum 10 words) designed to appear as text overlay on a photo in a Canva graphic. Bold, atmospheric, no hashtags. Make it feel like a newspaper front page meets true crime documentary.

INSTAGRAM_CAPTION:
An Instagram caption, 100–150 words. Start with a hook line. Tell enough of the story to create intrigue without giving everything away. End with a call to action directing followers to the full story on the blog or YouTube channel. Include 8–12 relevant hashtags at the end on a new line.

FACEBOOK_CAPTION:
A Facebook caption, 150–220 words. More conversational and detailed than Instagram. Give more context about the case and the psychological angle. End with a clear call to action linking to the blog and YouTube channel. No hashtags needed for Facebook.

Return only the three items with their labels. No preamble, no extra commentary.`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{ role: 'user', content: prompt }]
        })
      });

      const data = await response.json();

      if (data.error) {
        setError('canva', data.error.message);
        setError('instagram', data.error.message);
        setError('facebook', data.error.message);
        return;
      }

      const text = data.content[0].text;

      const canva = extract(text, 'CANVA_HEADLINE', 'INSTAGRAM_CAPTION');
      const instagram = extract(text, 'INSTAGRAM_CAPTION', 'FACEBOOK_CAPTION');
      const facebook = extract(text, 'FACEBOOK_CAPTION', null);

      setContent('canva', canva);
      setContent('instagram', instagram);
      setContent('facebook', facebook);

    } catch (err) {
      setError('canva', 'Error: ' + err.message);
      setError('instagram', 'Error: ' + err.message);
      setError('facebook', 'Error: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate Social Posts';
    }
  }

  function extract(text, startLabel, endLabel) {
    const start = text.indexOf(startLabel + ':');
    if (start === -1) return 'Could not parse this section.';
    const contentStart = start + startLabel.length + 1;
    const end = endLabel ? text.indexOf(endLabel + ':') : text.length;
    return text.slice(contentStart, end === -1 ? text.length : end).trim();
  }

  function copyText(id, btn) {
    const text = document.getElementById(id).textContent;
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.classList.remove('copied');
      }, 2000);
    });
  }
</script>
</body>
</html>
